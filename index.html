<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>서율이의 일본어 공부장</title>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--sub:#8e8e93;--card:#f2f2f7;--accent:#007aff;--star:#ff9f0a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#f2f2f7;--sub:#98989d;--card:#1c1c1e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans KR","Noto Sans JP",sans-serif;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
main{flex:1;overflow-y:auto;padding:16px 20px}
nav{display:flex;border-top:1px solid var(--card);background:var(--bg)}
nav button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:12px;color:var(--sub);cursor:pointer}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--accent)}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--sub);font-size:14px}
.bar{height:6px;background:var(--card);border-radius:3px;margin:10px 0 18px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.kanji{font-size:88px;text-align:center;font-weight:600;line-height:1.2;margin:10px 0 4px;word-break:keep-all}
.kana{text-align:center;font-size:22px;line-height:1.6}
.kana.k{color:var(--sub);font-size:18px}
.row{display:flex;justify-content:center;gap:10px;margin:14px 0}
.btn{border:0;border-radius:14px;background:var(--card);color:var(--fg);font-size:16px;padding:14px;width:100%;margin:5px 0;cursor:pointer;text-align:left}
.btn.pill{width:auto;border-radius:22px;padding:10px 20px;text-align:center;background:var(--accent);color:#fff}
.btn.on{outline:2px solid var(--accent)}
.ans{background:var(--card);border-radius:14px;padding:12px 14px;margin:-2px 0 8px;font-size:17px;line-height:1.6}
.cvs{display:flex;gap:10px;justify-content:center;margin-top:8px}.cv{width:min(46%,220px);aspect-ratio:1;touch-action:none;border-radius:10px;background:var(--bg)}.cvs+.btn{text-align:center;margin-top:10px}.nav2{display:flex;gap:10px;margin-top:12px}
.nav2 .btn{text-align:center;font-weight:600}
.star{background:none;border:0;font-size:26px;color:var(--star);cursor:pointer}
.item{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--card);cursor:pointer}
.item big{font-size:28px;min-width:90px}
h2{margin:6px 0 14px}
.kanji{background:linear-gradient(135deg,#eef4ff,#f8eeff);border-radius:24px;padding:22px 8px;box-shadow:0 6px 20px rgba(0,122,255,.12)}
.btn{transition:transform .1s,background .2s}.btn:active{transform:scale(.97)}
.btn.pill{background:linear-gradient(135deg,#007aff,#5e5ce6);box-shadow:0 4px 12px rgba(94,92,230,.3)}
.ans{animation:pop .25s ease}
.btn.ok{background:#34c759;color:#fff;animation:pop .3s}.btn.bad{background:#ff3b30;color:#fff;animation:shake .3s}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kanji{background:var(--card);box-shadow:none}}
.big{font-size:44px;font-weight:700}
.sub{color:var(--sub)}
.chips{display:flex;gap:8px;justify-content:center;margin:12px 0 4px;flex-wrap:wrap}.chip{border:0;border-radius:18px;background:var(--card);color:var(--accent);font-size:16px;padding:8px 14px;cursor:pointer}
.btn.pill.alt{background:var(--card);color:var(--fg);box-shadow:none}
.sv{display:block;width:100%;max-width:340px;margin:8px auto;border:1px solid var(--card);border-radius:20px;background:var(--bg)}
.sv path{fill:none;stroke-linecap:round;stroke-linejoin:round}.sv path.g{stroke:#d1d1d6;stroke-width:3.5}.sv path.s{stroke:var(--fg);stroke-width:4}.sv path.s.cur{stroke:var(--accent)}.sv path.gd{stroke:#d1d1d6;stroke-width:.5;stroke-dasharray:2 2}.sv text{font-size:6.5px;fill:#ff3b30;font-weight:700}
#hd{text-align:center;font-size:20px;font-weight:800;padding:12px 16px 8px;background:linear-gradient(135deg,#007aff,#bf5af2);-webkit-background-clip:text;background-clip:text;color:transparent}
</style>
</head>

function svBtn(){var b=document.getElementById('svb');if(b)b.textContent=SV.play?'⏸ 일시정지':'▶ 재생'}
function svTick(t){if(!SV||!SV.play)return;var N=KV[SV.c].length;if(!SV.last)SV.last=t;SV.p=Math.min(N,SV.p+(t-SV.last)/700*SV.sp);SV.last=t;svUpd();if(SV.p>=N){SV.play=false;svBtn()}else raf=requestAnimationFrame(svTick)}
function svPlay(){if(SV.p>=KV[SV.c].length)SV.p=0;SV.play=true;SV.last=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(svTick);svBtn()}
function svPause(){SV.play=false;cancelAnimationFrame(raf);svBtn()}
function svToggle(){SV.play?svPause():svPlay()}
function svRestart(){SV.p=0;svUpd();svPlay()}
function svStep(d){svPause();SV.p=Math.max(0,Math.min(KV[SV.c].length,Math.round(SV.p)+d));svUpd()}
function svSpeed(v){SV.sp=+v;var s=document.getElementById('svs');if(s)s.textContent=v+'배'}
function svRewrite(){clrCv();svRestart()}
function strokeScr(){var c=SV.c,P=KV[c],N=P.length;
var g=P.map(function(d){return `<path class='g' d='${d}'/>`}).join('');
var s=P.map(function(d){return `<path class='s' d='${d}'/>`}).join('');
var t=P.map(function(d,i){var m=d.match(/^M([\d.]+)[, ]([\d.]+)/);return m?`<text id='sn${i}' x='${+m[1]-4}' y='${+m[2]-1.5}' style='display:none'>${i+1}</text>`:''}).join('');
return `<div class='top'><button class='btn' style='width:auto;padding:8px 14px;margin:0' onclick='setTab("study")'>← 돌아가기</button><span>총 ${N}획</span></div>
<div class='kana' style='margin-top:10px'>현재 <b id='svc'>0 / ${N}획</b></div>
<svg id='sv' class='sv' viewBox='0 0 109 109'><path class='gd' d='M54.5 0V109M0 54.5H109'/>${g}${s}${t}</svg>
<div class='row'><button id='svb' class='btn pill' onclick='svToggle()'>▶ 재생</button><button class='btn pill alt' onclick='svRestart()'>↺ 처음부터</button></div>
<div class='row'><button class='btn pill alt' onclick='svStep(-1)'>◀ 이전 획</button><button class='btn pill alt' onclick='svStep(1)'>다음 획 ▶</button></div>
<div class='kana' style='font-size:15px'>속도 <b id='svs'>${SV.sp}배</b><br><input type='range' min='0.25' max='2' step='0.25' value='${SV.sp}' oninput='svSpeed(this.value)' style='width:70%'></div>
<h2 style='margin-top:22px'>직접 써보기</h2>
<div class='cvs'><canvas class='cv' data-c='${c}' style='width:min(100%,320px)'></canvas></div>
<div class='row'><button class='btn pill alt' onclick='clrCv()'>🧽 지우기</button><button class='btn pill alt' onclick='svRewrite()'>✏️ 다시 쓰기</button></div>
<p class='sub' style='font-size:12px;text-align:center'>획순 데이터: KanjiVG © Ulrich Apel (CC BY-SA 3.0)</p>`}
function exHTML(k){var e=EX[k];return e?`<div style='font-size:21px;line-height:1.6'>${e[0]}</div><div class='sub' style='margin-top:4px'>${e[1]}</div><button class='btn pill' style='width:auto;margin-top:10px' onclick='speak(EX[W[S.i][0]][0])'>🔊 예문 듣기</button>`:'예문 준비 중이에요.'}
var KO={};'あ아 い이 う우 え에 お오 か카 き키 く쿠 け케 こ코 が가 ぎ기 ぐ구 げ게 ご고 さ사 し시 す스 せ세 そ소 ざ자 じ지 ず즈 ぜ제 ぞ조 た타 ち치 つ츠 て테 と토 だ다 ぢ지 づ즈 で데 ど도 な나 に니 ぬ누 ね네 の노 は하 ひ히 ふ후 へ헤 ほ호 ば바 び비 ぶ부 べ베 ぼ보 ぱ파 ぴ피 ぷ푸 ぺ페 ぽ포 ま마 み미 む무 め메 も모 や야 ゆ유 よ요 ら라 り리 る루 れ레 ろ로 わ와 を오 きゃ캬 きゅ큐 きょ쿄 ぎゃ갸 ぎゅ규 ぎょ교 しゃ샤 しゅ슈 しょ쇼 じゃ자 じゅ주 じょ조 ちゃ차 ちゅ추 ちょ초 にゃ냐 にゅ뉴 にょ뇨 ひゃ햐 ひゅ휴 ひょ효 びゃ뱌 びゅ뷰 びょ뵤 ぴゃ퍄 ぴゅ퓨 ぴょ표 みゃ먀 みゅ뮤 みょ묘 りゃ랴 りゅ류 りょ료 てぃ티 でぃ디 ふぁ파 ふぃ피 ふぇ페 ふぉ포 しぇ셰 じぇ제 ちぇ체'.split(' ').forEach(function(e){KO[e.slice(0,-1)]=e.slice(-1)});
function jong(h,t){var k=h.charCodeAt(0)-44032;return k>=0&&k<11172&&k%28===0?String.fromCharCode(h.charCodeAt(0)+t):h}
function ko(s){var o=[];s=s.replace(/[ァ-ヶ]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-96)});for(var i=0;i<s.length;i++){var c=s[i],n=s[i+1]||'';if(c==='ー'||c==='・')continue;if(c==='っ'){if(o.length)o[o.length-1]=jong(o[o.length-1],19);continue}if(c==='ん'){if(o.length)o[o.length-1]=jong(o[o.length-1],4);continue}if(c==='、'){o.push(' ');continue}if(n&&'ゃゅょぁぃぅぇぉ'.indexOf(n)>=0&&KO[c+n]){o.push(KO[c+n]);i++;continue}o.push(KO[c]||c)}return o.join('')}
function isK(t){return /[\u4e00-\u9fff]/.test(t)}
function fs(t){return t.length>7?34:t.length>5?44:t.length>3?60:88}
function study(){
var w=W[S.i],f=S.fav.indexOf(S.i)>=0;
var h='<div class="top"><span>'+(S.i+1)+' / '+W.length+'</span><button class="star" onclick="fav('+S.i+')" aria-label="즐겨찾기">'+(f?'★':'☆')+'</button></div>';
h+='<div class="bar"><i style="width:'+((S.i+1)/W.length*100)+'%"></i></div>';
h+='<div class="kanji" style="font-size:'+fs(w[0])+'px">'+w[0]+'</div>'+chips(w[0]);
h+='<div class="row"><button class="btn pill" onclick="speak(\''+w[1]+'\')">🔊 듣기</button></div>';
var K=isK(w[0]);[["k","읽는 법 · 한글음 보기",'<div class="kana">'+w[1]+' <span class="sub" style="font-size:19px">('+ko(w[1])+')</span></div>'],K&&["w","✍️ 한자 쓰는 법 보기",writeHTML(w[0])],EX[w[0]]&&["e","📝 예문 보기",exHTML(w[0])],["m","한국어 뜻 보기",w[2]],K&&w[3]&&w[3]!=="-"&&["y","음독 · 훈독 보기","<b>음독</b> "+w[3]+"<br><b>훈독</b> "+w[4]],w[5]&&["t","💡 암기 팁 보기",w[5]]].filter(Boolean).forEach(function(b){
h+='<button class="btn'+(open[b[0]]?' on':'')+'" onclick="tog(\''+b[0]+'\')">'+b[1]+'</button>';
if(open[b[0]])h+='<div class="ans">'+b[2]+'</div>'});
h+='<div class="nav2"><button class="btn" onclick="go(-1)">◀ 이전</button><button class="btn" onclick="go(1)">다음 ▶</button></div>';
return h}
var Q=null;
function shuf(a){return a.slice().sort(function(){return Math.random()-.5})}
function qMake(){var id=Q.list[Q.k],o=[id];while(o.length<4){var r=Math.floor(Math.random()*W.length);if(o.indexOf(r)<0&&W[r][2]!==W[id][2])o.push(r)}Q.opts=shuf(o);Q.picked=-1}
function qStart(m){var p=m?S.wrong.slice():W.map(function(_,i){return i});if(!p.length)return;Q={mode:m,list:shuf(p).slice(0,10),k:0,score:0,done:false};qMake();render()}
function qPick(j){if(Q.picked>=0)return;Q.picked=j;var id=Q.list[Q.k],x=S.wrong.indexOf(id);if(Q.opts[j]===id){Q.score++;if(x>=0)S.wrong.splice(x,1)}else if(x<0)S.wrong.push(id);save();speak(W[id][1]);render()}
function qNext(){Q.k++;if(Q.k>=Q.list.length)Q.done=true;else qMake();render()}
function quiz(){
if(!Q){var n=S.wrong.length;return `<h2>퀴즈</h2><p class='sub'>한자를 보고 알맞은 뜻을 고르세요. (10문제)</p><button class='btn pill' style='width:100%' onclick='qStart(0)'>🎯 새 퀴즈 시작</button><button class='btn' style='text-align:center;margin-top:12px' onclick='qStart(1)'>🔁 오답 복습 (${n})</button>${n?'':"<p class='sub'>틀린 단어가 생기면 여기서 다시 연습할 수 있어요.</p>"}`}
if(Q.done){return `<h2>결과</h2><div class='big'>${Q.score} / ${Q.list.length}</div><p class='sub'>${Q.score===Q.list.length?'완벽해요! 🎉':'틀린 단어는 오답 복습에 저장됐어요.'}</p><button class='btn pill' style='width:100%' onclick='qStart(${Q.mode})'>다시 하기</button><button class='btn' style='text-align:center;margin-top:10px' onclick='Q=null;render()'>퀴즈 홈</button>`}
var id=Q.list[Q.k],w=W[id],a=Q.picked>=0;
var h=`<div class='top'><span>${Q.k+1} / ${Q.list.length}${Q.mode?' · 복습':''}</span><span>점수 ${Q.score}</span></div><div class='bar'><i style='width:${(Q.k+(a?1:0))/Q.list.length*100}%'></i></div><div class='kanji' style='font-size:${Math.min(64,fs(w[0]))}px'>${w[0]}</div><div class='kana' style='min-height:36px'>${a?w[1]+' <span class=sub style=font-size:16px>('+ko(w[1])+')</span>':''}</div>`;
Q.opts.forEach(function(o,j){var c='btn';if(a){if(o===id)c+=' ok';else if(j===Q.picked)c+=' bad'}h+=`<button class='${c}' onclick='qPick(${j})'>${W[o][2]}</button>`});
if(a)h+=`<button class='btn pill' style='width:100%;margin-top:12px' onclick='qNext()'>${Q.k+1>=Q.list.length?'결과 보기':'다음 ▶'}</button>`;
return h}
function favs(){
var h='<h2>즐겨찾기</h2>';
if(!S.fav.length)return h+'<p class="sub">학습 화면에서 ☆를 눌러 단어를 추가해 보세요.</p>';
S.fav.forEach(function(i){h+='<div class="item" onclick="S.i='+i+';open={};save();setTab(\'study\')"><big>'+W[i][0]+'</big><span>'+W[i][1]+'<br><span class="sub">'+W[i][2]+'</span></span></div>'});
return h}
function prog(){
var n=S.done.length,p=Math.round(n/W.length*100);
return '<h2>학습 진도</h2><div class="big">'+p+'%</div><p class="sub">'+n+' / '+W.length+' 단어 학습 완료</p><div class="bar"><i style="width:'+p+'%"></i></div><p>즐겨찾기 <b>'+S.fav.length+'</b>개 · 복습할 단어 <b>'+S.wrong.length+'</b>개</p><button class="btn" onclick="setTab(\'study\')">이어서 학습하기 ('+(S.i+1)+'번째)</button><button class="btn" onclick="if(confirm(\'진도를 초기화할까요?\')){S.done=[];S.i=0;save();render()}">진도 초기화</button>'}
function render(){
document.getElementById("m").innerHTML=tab==="study"?study():tab==="stroke"?strokeScr():tab==="quiz"?quiz():tab==="fav"?favs():prog();
if(tab==="study"&&open.w)initCv();if(tab==="stroke"){initCv();svUpd()}
document.getElementById("n").innerHTML=[["study","📖","학습"],["quiz","🎯","퀴즈"],["fav","⭐","즐겨찾기"],["prog","📊","진도"]].map(function(t){return '<button class="'+((tab==='stroke'?'study':tab)===t[0]?'on':'')+'" onclick="setTab(\''+t[0]+'\')"><b>'+t[1]+'</b>'+t[2]+'</button>'}).join("")}
try{speechSynthesis.getVoices()}catch(e){}
render();
</script>
